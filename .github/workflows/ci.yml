name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python3 tests/test_*.py
      - name: Compile scripts
        run: python3 -m py_compile scripts/*.py
      - name: Validate sample-knowledge
        run: python3 scripts/ptr_common.py validate --bundle sample-knowledge
